<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>モンスト ガイド</title>
<link rel="stylesheet" href="assets/common.css">
</head>
<body class="page">

<h1>モンスト ガイド</h1>

<h2>ツール</h2>
<ul class="menu">
  <li><a href="reflect.html">壁反射シミュレーター<small>引っ張った方向から壁での跳ね返りを確認する</small></a></li>
</ul>

<h2>クエスト</h2>
<div class="chips" id="difficultyFilter"></div>
<ul class="menu" id="questList"></ul>

<script src="data/quests.js"></script>
<script>
const filterEl = document.getElementById('difficultyFilter');
const listEl = document.getElementById('questList');

// 難易度フィルタは ?d=<難易度ID> で保持（パンくずから戻ったときも絞り込んだまま）
let current = new URLSearchParams(location.search).get('d') || '';
if (current && !findDifficulty(current)) current = '';

function render() {
  filterEl.textContent = '';
  for (const d of [{ id: '', name: 'すべて' }, ...DIFFICULTIES]) {
    const btn = document.createElement('button');
    btn.textContent = d.name;
    btn.setAttribute('aria-pressed', String(d.id === current));
    btn.addEventListener('click', () => {
      current = d.id;
      history.replaceState(null, '', current ? `?d=${current}` : location.pathname);
      render();
    });
    filterEl.appendChild(btn);
  }

  listEl.textContent = '';
  for (const q of QUESTS.filter(q => !current || q.difficulty === current)) {
    const li = document.createElement('li');
    const a = document.createElement('a');
    a.href = `quest.html?q=${q.id}`;
    const badge = document.createElement('span');
    badge.className = 'badge';
    badge.textContent = findDifficulty(q.difficulty).name;
    const small = document.createElement('small');
    small.textContent = q.description;
    a.append(badge, q.name, small);
    li.appendChild(a);
    listEl.appendChild(li);
  }
}

render();
</script>
</body>
</html>
